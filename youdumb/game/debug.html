<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Dashboard & Editor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #202024;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #04d361;
        }

        .stat-group {
            margin-bottom: 1.5rem;
            background: #29292e;
            padding: 1rem;
            border-radius: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #a8a8b3;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
        }

        input[type="number"] {
            flex: 1;
            background-color: #121214;
            border: 2px solid #29292e;
            color: #fff;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 1.2rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #04d361;
        }

        /* Quick control buttons */
        .btn-adjust {
            background-color: #4d4d57;
            color: white;
            border: none;
            padding: 0 0.75rem;
            font-size: 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-adjust:hover {
            background-color: #626270;
        }

        .btn-submit {
            width: 100%;
            background-color: #04d361;
            color: #121214;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #06b956;
        }

        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1rem;
            color: #8257e5;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Database Modifier</h1>
    
    <form id="statForm">
        <div class="stat-group">
            <label for="failTimes">Fail Times</label>
            <div class="input-container">
                <button type="button" class="btn-adjust" onclick="adjust('failTimes', -1)">-</button>
                <input type="number" id="failTimes" name="failTimes" value="0" min="0">
                <button type="button" class="btn-adjust" onclick="adjust('failTimes', 1)">+</button>
            </div>
        </div>

        <div class="stat-group">
            <label for="dumbScore">Dumb Score</label>
            <div class="input-container">
                <button type="button" class="btn-adjust" onclick="adjust('dumbScore', -1)">-</button>
                <input type="number" id="dumbScore" name="dumbScore" value="0" min="0">
                <button type="button" class="btn-adjust" onclick="adjust('dumbScore', 1)">+</button>
            </div>
        </div>

        <button type="submit" class="btn-submit">Save Changes</button>
    </form>

    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    // Elements
    const failTimesInput = document.getElementById('failTimes');
    const dumbScoreInput = document.getElementById('dumbScore');
    const statForm = document.getElementById('statForm');
    const statusMsg = document.getElementById('statusMsg');

    // Load initial data from localStorage (or default to 0 if empty)
    function init() {
        const storedFailTimes = localStorage.getItem('failTimes') || '0';
        const storedDumbScore = localStorage.getItem('dumbScore') || '0';
        
        failTimesInput.value = storedFailTimes;
        dumbScoreInput.value = storedDumbScore;
    }

    // Quick +/- adjustment handler
    function adjust(fieldId, amount) {
        const input = document.getElementById(fieldId);
        let currentVal = parseInt(input.value) || 0;
        currentVal += amount;
        
        // Prevent negative values if desired
        if (currentVal < 0) currentVal = 0;
        
        input.value = currentVal;
    }

    // Save data to localStorage on submit
    statForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        localStorage.setItem('failTimes', failTimesInput.value);
        localStorage.setItem('dumbScore', dumbScoreInput.value);
        
        // Show success confirmation
        statusMsg.textContent = "Values updated successfully!";
        setTimeout(() => {
            statusMsg.textContent = "";
        }, 2500);
    });

    // Run on startup
    init();
</script>

</body>
</html>
