<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SiMpLe GaMe</title>
  <link rel="icon" type="image/x-icon" href="/dumb.png">
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

  <style>
    @font-face {
      font-family: 'font';
      src: url('font.ttf');
    }

    body, html {
      height: 100%;
      margin: 0;
      background: #f9f9f9;
      font-family: 'font', sans-serif;
      overflow: hidden;
      position: relative;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      z-index: 1;
      position: relative;
      pointer-events: none;
    }

    #timer {
      font-size: 3vw;
      margin-bottom: 1em;
      z-index: 2;
      pointer-events: auto;
    }

    .h-captcha {
      transform: scale(1.2);
      z-index: 2;
      pointer-events: auto;
    }

    .dumb-button {
      background-color: #28a745;
      color: white;
      border: 2px solid #28a745;
      border-radius: 8px;
      font-size: 1.8vw;
      padding: 0.8rem 1.5rem;
      cursor: pointer;
      position: absolute;
      z-index: 3;
      font-family: 'font', sans-serif;
      transition: background-color 0.3s;
      white-space: nowrap;
      pointer-events: auto;
    }

    .dumb-button:hover {
      background-color: #218838;
    }

    #float-buttons {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    #float-buttons button {
      pointer-events: all;
    }

    /* === FAKE CAPTCHA STYLES === */
    #fake-captcha-container {
      display: none;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      width: 340px;
      z-index: 2;
      pointer-events: auto;
      font-family: Arial, sans-serif;
    }
    .captcha-header {
      background: #4a90e2;
      color: white;
      padding: 15px;
      text-align: left;
    }
    .captcha-header span { display: block; font-size: 14px; margin-bottom: 4px; }
    .captcha-header strong { display: block; font-size: 26px; font-weight: bold; }
    .captcha-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      width: 100%;
      height: 100%;
    }
    .grid-square {
      border: 1px solid white;
      box-sizing: border-box;
      cursor: pointer;
    }
    .grid-square.selected {
      background: rgba(255, 255, 255, 0.4);
      border: 3px solid #4a90e2;
    }
    .captcha-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border-top: 1px solid #ccc;
    }
    #captcha-error {
      color: #d93025;
      font-size: 14px;
      display: none;
      font-weight: bold;
    }
    .verify-btn {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
    }
    .verify-btn:hover { background: #357abd; }
  </style>
</head>
<body>
  <audio id="bg-music" src="msc.mp3" loop preload="auto"></audio>

  <div id="game-container">
    <div id="timer">Time Left: 30s</div>
    
    <div class="h-captcha"
         data-sitekey="4776381a-492e-43b6-9354-6e6a59ea3a90"
         data-callback="onCaptchaSuccess"
         data-expired-callback="onCaptchaExpired"
         data-error-callback="onCaptchaError">
    </div>

    <div id="fake-captcha-container">
      <div class="captcha-header">
        <span>please select all squares with</span>
        <strong>220Ω resistors</strong>
      </div>
      
      <div style="position: relative; width: 340px; height: 340px; background-image: url('circuit.png'); background-size: cover; background-position: center;">
        <div class="captcha-grid">
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
          <div class="grid-square" onclick="this.classList.toggle('selected')"></div>
        </div>
      </div>
      
      <div style="text-align: center; padding: 6px 0;">
        <span id="captcha-error">Please try again!</span>
      </div>
      
      <div class="captcha-footer">
        <div style="color: #555; font-size: 22px; cursor: pointer; letter-spacing: 5px;">↻ 🎧 ⓘ</div>
        <button class="verify-btn" onclick="fakeVerify()">VERIFY</button>
      </div>
    </div>
  </div>

  <div id="float-buttons"></div>

  <script>
    const bgMusic = document.getElementById('bg-music');

    // List of music files
    const musicFiles = ['1.mp3', '2.mp3', '3.mp3', '4.mp3'];

    // Pick a random file
    bgMusic.src = musicFiles[Math.floor(Math.random() * musicFiles.length)];

    // Try to autoplay music, fallback to click if blocked
    function playMusic() {
     const playPromise = bgMusic.play();
     if (playPromise !== undefined) {
      playPromise.catch(() => {
        // Autoplay blocked: wait for user interaction
       document.addEventListener('click', startMusicOnce);
      });
     }
    }

    function startMusicOnce() {
     bgMusic.play();
      document.removeEventListener('click', startMusicOnce);
    }

    // Start on load
    window.addEventListener('load', playMusic);

    // === GAME LOGIC ===
    const timeLimits = [30, 28, 24, 20, 16, 12, 8, 5, 4, 3];
    let currentRound = 0;
    let timeLeft = timeLimits[0];
    let timerInterval;

    const timerDisplay = document.getElementById("timer");

    function startTimer() {
      timeLeft = timeLimits[currentRound];
      timerDisplay.textContent = `Time Left: ${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `Time Left: ${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          failOut();
        }
      }, 1000);
    }

    function resetCaptcha() {
      if (window.hcaptcha) {
        hcaptcha.reset();
      }
    }

    function onCaptchaSuccess() {
      clearInterval(timerInterval);
      currentRound++;

      // When round hits index 9 (Round 10), switch to the fake captcha
      if (currentRound === 9) {
        alert("Completed! Continue to the final round!");
        document.querySelector('.h-captcha').style.display = 'none';
        document.getElementById('fake-captcha-container').style.display = 'block';
        startTimer(); // Initiates the final brutal 3-second timer
        return;
      }

      if (currentRound >= 10) {
        alert("We are sorry, but we are not sorry, as some expected error occurred. Err_idiot_detected");
        location.reload();
        return;
      }

      alert("Completed! Continue to the next round!");
      resetCaptcha();
      startTimer();
    }

    function onCaptchaExpired() {
      clearInterval(timerInterval);
      failOut();
    }

    function onCaptchaError() {
      clearInterval(timerInterval);
      failOut();
    }

    function failOut() {
      let dumbScore = localStorage.getItem("dumbScore") || 0;
      dumbScore++;
      localStorage.setItem("dumbScore", dumbScore);
      alert(`You've failed and admitted you're dumb ${dumbScore} time(s).`);
      window.location.href = "/youdumb/ofc";
    }

    // Unwinnable Fake Captcha Logic
    function fakeVerify() {
      const errorMsg = document.getElementById('captcha-error');
      errorMsg.style.display = 'block';
      
      // Clears their selections to annoy them even more while the timer ticks down
      const squares = document.querySelectorAll('.grid-square');
      squares.forEach(sq => sq.classList.remove('selected'));
    }

    window.onload = () => {
      startTimer();
    };

    // === FLOATING BUTTONS ===
    const floatContainer = document.getElementById('float-buttons');

    function randomDirection() {
      const dx = Math.random() > 0.5 ? 1 : -1;
      const dy = Math.random() > 0.5 ? 1 : -1;
      const speed = Math.random() * 2 + 1;
      return { dx: dx * speed, dy: dy * speed };
    }

    function animateButton(button) {
      let x = Math.random() * (window.innerWidth - 200);
      let y = Math.random() * (window.innerHeight - 100);
      let { dx, dy } = randomDirection();

      function move() {
        const width = button.offsetWidth || 160;
        const height = button.offsetHeight || 50;

        x += dx;
        y += dy;

        if (x <= 0 || x + width >= window.innerWidth) dx = -dx;
        if (y <= 0 || y + height >= window.innerHeight) dy = -dy;

        button.style.left = `${x}px`;
        button.style.top = `${y}px`;
        requestAnimationFrame(move);
      }

      move();
    }

    setInterval(() => {
      const btn = document.createElement("button");
      btn.textContent = "I am DUMB";
      btn.className = "dumb-button";
      btn.onclick = () => {
        let dumbScore = localStorage.getItem("dumbScore") || 0;
        dumbScore++;
        localStorage.setItem("dumbScore", dumbScore);
        alert(`You've admitted you're dumb ${dumbScore} time(s).`);
        window.location.href = "/youdumb/ofc";
      };

      floatContainer.appendChild(btn);
      animateButton(btn);
    }, 1000);
  </script>
</body>
</html>
